<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EcoCiclo: La Aventura Circular</title>
<style>
  :root{
    --azul:#1CA7EC; --azul2:#0E7FB8; --verde:#3FBF7F; --verde2:#279A5F;
    --amarillo:#FFC93C; --naranja:#FF8A4C; --violeta:#8E6FE0; --rosa:#FF6F9C;
    --crema:#FFF7E6; --marron:#7A5230; --oscuro:#123146;
    --topbar-h:64px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Trebuchet MS',Verdana,sans-serif;background:#0d3b46;}
  #app{position:relative;width:100%;height:100%;overflow:hidden;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;
    padding-top:20px; overflow:hidden;}
  .screen.active{display:flex;}
  .screen.hud{padding-top:calc(var(--topbar-h) + 16px);}
  .screen.full{padding:0;}
  .bg-sky{
    position:relative;
    background:
      radial-gradient(ellipse 55% 30% at 18% 10%, rgba(255,244,200,.45), transparent 60%),
      linear-gradient(180deg,#5FC2E8 0%,#57C6C2 32%,#3FAE8C 58%,#2C8F63 100%);
  }
  .bg-sky::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 90% 22% at 20% 62%, rgba(255,255,255,.16), transparent 70%),
      radial-gradient(ellipse 70% 26% at 78% 78%, rgba(19,74,52,.55), transparent 72%),
      radial-gradient(ellipse 60% 20% at 30% 90%, rgba(15,60,42,.55), transparent 70%),
      radial-gradient(ellipse 120% 40% at 50% 108%, rgba(10,45,32,.65), transparent 75%);
    filter:blur(2px);
  }
  .bg-sky::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
    box-shadow:inset 0 0 120px rgba(0,20,15,.35);
  }
  .bg-sky.theme-ibera{
    background:
      radial-gradient(ellipse 55% 30% at 18% 10%, rgba(255,244,200,.4), transparent 60%),
      linear-gradient(180deg,#7FD9C4 0%,#5FC49A 35%,#3D9E6C 65%,#2B7A4E 100%);
  }
  .bg-sky>*{position:relative;z-index:1;}
  h1{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18);font-size:2.1em;margin:0 0 6px;text-align:center;letter-spacing:.5px;}
  h2{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18);margin:4px 0;text-align:center;}
  p.sub{color:#EFFFFA;text-shadow:0 1px 0 rgba(0,0,0,.15);text-align:center;max-width:560px;margin:4px 0 18px;font-size:1.05em;}
  .droplet-logo{width:110px;height:130px;margin-bottom:6px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));}
  .btn{
    background:linear-gradient(180deg,var(--amarillo),#FFB300);
    border:none;border-radius:20px;padding:16px 30px;font-size:1.2em;font-weight:bold;
    color:#5A3A00;box-shadow:0 6px 0 #C98A00; cursor:pointer;margin:8px;transition:transform .08s;
    min-width:180px;
  }
  .btn:active{transform:translateY(6px);box-shadow:0 0 0 #C98A00;}
  .btn.green{background:linear-gradient(180deg,#6EE7A5,var(--verde));box-shadow:0 6px 0 var(--verde2);color:#0B3A22;}
  .btn.blue{background:linear-gradient(180deg,#7FD4FF,var(--azul));box-shadow:0 6px 0 var(--azul2);color:#04304a;}
  .btn.pink{background:linear-gradient(180deg,#FFA3C0,var(--rosa));box-shadow:0 6px 0 #C24870;color:#5A0F2A;}
  .rowbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:600px;}
  .card{
    background:rgba(255,255,255,.96);border-radius:24px;padding:22px;box-shadow:0 12px 30px rgba(0,0,0,.28);
    max-width:640px;width:100%;text-align:center;
  }
  .card h2, .card p.sub{color:var(--oscuro);text-shadow:none;}
  #topbar{position:absolute;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;z-index:20;pointer-events:none;
    background:linear-gradient(180deg,rgba(6,40,50,.55),rgba(6,40,50,0));}
  #topbar>*{pointer-events:auto;}
  .pill{background:rgba(255,255,255,.94);border-radius:20px;padding:6px 12px;font-weight:bold;color:var(--oscuro);
    display:flex;align-items:center;gap:5px;box-shadow:0 3px 8px rgba(0,0,0,.2);font-size:.95em;}
  .iconbtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);border:none;
    box-shadow:0 3px 8px rgba(0,0,0,.2);font-size:1.2em;cursor:pointer;flex-shrink:0;}
  #stage{position:relative;width:100%;height:100%;}
  .avatar-pick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:10px 0;}
  .avatar-opt{width:96px;height:96px;border-radius:50%;border:5px solid transparent;cursor:pointer;
    background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .avatar-opt svg{width:70%;height:70%;}
  .avatar-opt.selected{border-color:var(--amarillo);box-shadow:0 0 0 4px rgba(255,201,60,.4), 0 4px 10px rgba(0,0,0,.25);}
  .age-card{background:rgba(255,255,255,.96);border-radius:22px;padding:18px 22px;margin:10px;width:210px;
    cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.22);border:4px solid transparent;text-align:center;}
  .age-card.selected{border-color:var(--verde);}
  .age-card svg{width:70px;height:70px;}
  #mapscroll{position:absolute;inset:0;top:var(--topbar-h);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
  #mapcanvas{position:relative;width:100%;}
  .map-node{position:absolute;width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.35);cursor:pointer;border:5px solid #fff;overflow:hidden;background:#fff;}
  .map-node svg{width:58%;height:58%;}
  .map-node .badge{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#fff;border-radius:10px;
    padding:1px 7px;font-size:.62em;font-weight:bold;color:var(--oscuro);box-shadow:0 2px 5px rgba(0,0,0,.2);white-space:nowrap;}
  .map-node.locked{filter:grayscale(1) brightness(.75);cursor:not-allowed;}
  .map-node .star{position:absolute;top:-11px;right:-8px;font-size:1em;text-shadow:0 1px 2px rgba(0,0,0,.4);}
  #minigame-area{width:100%;height:100%;position:relative;overflow-y:auto;}
  .dropzone{border:4px dashed #ffffffcc;border-radius:18px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.16);flex-direction:column;color:#fff;font-weight:bold;text-shadow:0 1px 2px rgba(0,0,0,.2);}
  .dropzone.over{background:rgba(255,255,255,.4);border-color:#fff;}
  .draggable{cursor:grab;touch-action:none;}
  .toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:#fff;padding:12px 22px;
    border-radius:16px;font-weight:bold;color:var(--oscuro);box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:50;
    font-size:1.2em;opacity:0;transition:opacity .25s;}
  .toast.show{opacity:1;}
  .progressbar{width:80%;max-width:400px;height:16px;background:rgba(255,255,255,.5);border-radius:10px;overflow:hidden;margin:8px auto;}
  .progressbar>div{height:100%;background:linear-gradient(90deg,var(--verde),var(--amarillo));width:0%;transition:width .3s;}
  .timerbar{width:200px;height:12px;background:rgba(255,255,255,.5);border-radius:8px;overflow:hidden;}
  .timerbar>div{height:100%;background:var(--naranja);width:100%;}
  .quiz-opt{background:#fff;border-radius:16px;padding:14px;margin:6px 0;width:100%;text-align:left;font-size:1.05em;
    box-shadow:0 4px 10px rgba(0,0,0,.1);cursor:pointer;border:3px solid transparent;display:flex;align-items:center;gap:10px;}
  .quiz-opt.correct{border-color:var(--verde);background:#E4FCEE;}
  .quiz-opt.wrong{border-color:#E05A5A;background:#FDE8E8;}
  .confetti{position:absolute;top:-20px;border-radius:2px;pointer-events:none;}
  #footer-credit{position:absolute;bottom:6px;right:10px;color:#ffffffaa;font-size:.65em;z-index:5;}
  ::-webkit-scrollbar{display:none;}
  @keyframes drift{0%{transform:translateX(-6%);}100%{transform:translateX(6%);}}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  @keyframes waveMove{0%{background-position-x:0;}100%{background-position-x:120px;}}
  .cine-wave{position:absolute;left:0;right:0;bottom:0;height:70px;
    background:linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,.05)),
      repeating-linear-gradient(115deg, rgba(255,255,255,.18) 0 14px, transparent 14px 30px);
    animation:waveMove 3.5s linear infinite;}
  .cine-sun{position:absolute;top:14%;left:12%;width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle,#FFE59A,#FFC93C 70%);box-shadow:0 0 40px 10px rgba(255,201,60,.55);animation:bob 4s ease-in-out infinite;}
  .cine-leaf{position:absolute;animation:bob 5s ease-in-out infinite;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar" style="display:none;">
    <div id="hud-avatar"></div>
    <div class="pill">💧 <span id="hud-drops">0</span></div>
    <div class="pill">⭐ <span id="hud-stars">0</span></div>
    <div id="hud-hints"></div>
    <button class="iconbtn" id="btn-store">🛍️</button>
    <button class="iconbtn" id="btn-sound">🔊</button>
    <button class="iconbtn" id="btn-home">🏠</button>
  </div>
  <div id="stage"></div>
</div>

<script>
/* ============ AUDIO (sintetizado, sin archivos externos) ============ */
const AudioX = (()=>{
  let ctx=null, on=true;
  function ensure(){
    if(!ctx){ ctx = new (window.AudioContext||window.webkitAudioContext)(); }
    if(ctx.state==='suspended'){ ctx.resume(); }
  }
  function beep(freq=440,dur=.12,type='sine',vol=.18,delay=0){
    if(!on) return; ensure();
    const t=ctx.currentTime+delay;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+dur+.02);
  }
  return {
    toggle(){ on=!on; return on; },
    click(){ beep(520,.06,'triangle',.15); },
    correct(){ beep(660,.1,'sine',.2); beep(880,.14,'sine',.2,.09); beep(1100,.18,'sine',.2,.18); },
    wrong(){ beep(180,.22,'sawtooth',.15); },
    win(){ [523,659,784,1046].forEach((f,i)=>beep(f,.18,'sine',.22,i*.11)); },
    drop(){ beep(300,.08,'square',.12); },
    pop(){ beep(700+Math.random()*200,.07,'triangle',.12); },
    tick(){ beep(1000,.04,'square',.06); },
    isOn(){ return on; },
    unlock(){ ensure(); }
  };
})();
document.addEventListener('touchstart',()=>AudioX.unlock(),{once:true,passive:true});
document.addEventListener('click',()=>AudioX.unlock(),{once:true});

/* ============ ESTADO GLOBAL ============ */
const State = {
  avatar: 0,
  ageBand: null, // 'a' 6-8, 'b' 8-10, 'c' 10-12
  drops: 0,
  stars: {}, // levelId -> stars
  currentLevel: null,
  owned: [],
  hints: 0,
  equipped: { frame:null, mascot:null },
};
function saveState(){ try{ localStorage.setItem('ecociclo_save', JSON.stringify(State)); }catch(e){} }
function loadState(){ try{ const s = JSON.parse(localStorage.getItem('ecociclo_save')); if(s) Object.assign(State,s);}catch(e){} }
loadState();
// migración: re-aplicar efectos de compras hechas en versiones anteriores donde no se aplicaban
if(State.owned && State.owned.length){
  if(!State.equipped) State.equipped={frame:null,mascot:null};
  if(State.owned.includes('marco_hoja')) State.equipped.frame='hoja';
  if(State.owned.includes('marco_oro')) State.equipped.frame='oro';
  if(State.owned.includes('mascota_pez')) State.equipped.mascot='🐟';
  if(State.owned.includes('mascota_yacare')) State.equipped.mascot='🐊';
  if(State.hints===undefined) State.hints = State.owned.filter(k=>k==='pista').length;
  saveState();
}

const AVATAR_NAMES = ['Carpincho','Tatú mulita','Yaguareté','Yacaré','Tortuga','Cotorra'];
function svgCapybara(){return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="60" rx="38" ry="26" fill="#A9773F"/><ellipse cx="50" cy="60" rx="38" ry="26" fill="none" stroke="#7A5230" stroke-width="3"/><circle cx="78" cy="45" r="19" fill="#B98847"/><circle cx="70" cy="34" r="6" fill="#7A5230"/><circle cx="86" cy="34" r="6" fill="#7A5230"/><circle cx="90" cy="46" r="3" fill="#3B2413"/><ellipse cx="92" cy="52" rx="4" ry="3" fill="#3B2413"/></svg>`;}
function svgArmadillo(){return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="62" rx="34" ry="22" fill="#C9B18C"/><path d="M18 55 A34 22 0 0 1 82 55" fill="none" stroke="#8C7350" stroke-width="4"/><path d="M22 62 A30 18 0 0 1 78 62" fill="none" stroke="#8C7350" stroke-width="3"/><path d="M26 70 A26 14 0 0 1 74 70" fill="none" stroke="#8C7350" stroke-width="3"/><ellipse cx="80" cy="58" rx="14" ry="10" fill="#C9B18C" transform="rotate(20 80 58)"/><circle cx="90" cy="55" r="2.5" fill="#3B2413"/><ellipse cx="20" cy="72" rx="6" ry="10" fill="#C9B18C"/></svg>`;}
function svgJaguar(){return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="58" rx="34" ry="26" fill="#F2A65A"/><circle cx="30" cy="30" r="9" fill="#F2A65A"/><circle cx="70" cy="30" r="9" fill="#F2A65A"/><circle cx="50" cy="42" r="26" fill="#F2A65A"/><circle cx="40" cy="38" r="3" fill="#3B2413"/><circle cx="60" cy="38" r="3" fill="#3B2413"/><ellipse cx="50" cy="50" rx="4" ry="3" fill="#3B2413"/><circle cx="34" cy="52" r="2.5" fill="#3B2413"/><circle cx="66" cy="52" r="2.5" fill="#3B2413"/><circle cx="26" cy="65" r="2.5" fill="#3B2413"/><circle cx="74" cy="65" r="2.5" fill="#3B2413"/><circle cx="44" cy="68" r="2.5" fill="#3B2413"/><circle cx="56" cy="68" r="2.5" fill="#3B2413"/></svg>`;}
function svgCaiman(){return `<svg viewBox="0 0 100 100"><ellipse cx="55" cy="62" rx="34" ry="16" fill="#4F8F5E"/><path d="M18 62 Q6 58 4 66 Q10 70 20 68 Z" fill="#3F7A4C"/><rect x="30" y="50" width="12" height="6" fill="#3F7A4C"/><rect x="48" y="50" width="12" height="6" fill="#3F7A4C"/><rect x="66" y="50" width="10" height="6" fill="#3F7A4C"/><circle cx="30" cy="45" r="3" fill="#F2C744"/><circle cx="42" cy="45" r="3" fill="#F2C744"/></svg>`;}
function svgTurtle(){return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="30" ry="24" fill="#3FBF7F"/><path d="M50 32 a26 22 0 0 1 0 46 a26 22 0 0 1 0-46" fill="none" stroke="#279A5F" stroke-width="2"/><path d="M30 55h40M50 32v46M35 40l30 30M65 40l-30 30" stroke="#279A5F" stroke-width="2"/><circle cx="83" cy="50" r="9" fill="#3FBF7F"/><ellipse cx="20" cy="72" rx="6" ry="9" fill="#3FBF7F"/><ellipse cx="78" cy="72" rx="6" ry="9" fill="#3FBF7F"/></svg>`;}
function svgParrot(){return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="60" rx="20" ry="30" fill="#4CAF6B"/><circle cx="50" cy="30" r="16" fill="#6FCB6F"/><path d="M60 28 q14 2 12 12 q-10 2 -14-6 Z" fill="#F2A65A"/><circle cx="45" cy="26" r="2.5" fill="#222"/><path d="M40 62 q-14 6 -10 20 q12 -2 16-14Z" fill="#2E7D53"/><path d="M60 62 q14 6 10 20 q-12 -2 -16-14Z" fill="#2E7D53"/></svg>`;}
const AVATARS = [svgCapybara,svgArmadillo,svgJaguar,svgCaiman,svgTurtle,svgParrot];
const AVATAR_COLORS = ['#A9773F','#C9B18C','#F2A65A','#4F8F5E','#3FBF7F','#4CAF6B'];

/* Niveles: contenido temático de economía circular / de corrientes (agua, residuos, energía) */
const LEVELS = [
  {id:'l1', name:'El Paraná Herido', icon:'💧', theme:'Ciclo del agua y contaminación', color:'var(--azul)'},
  {id:'l2', name:'Esteros del Iberá', icon:'🗑️', theme:'Separar residuos', color:'var(--marron)'},
  {id:'l3', name:'Taller en Corrientes', icon:'🔧', theme:'Reutilizar y reparar', color:'var(--naranja)'},
  {id:'l4', name:'Fábrica Circular Correntina', icon:'🏭', theme:'De residuo a recurso', color:'var(--violeta)'},
  {id:'l5', name:'Represa de Yacyretá', icon:'⚡', theme:'Energías limpias', color:'var(--amarillo)'},
  {id:'l6', name:'Consejo de Corrientes', icon:'🌍', theme:'Decisiones finales', color:'var(--verde)'},
];

function difficultyFor(band){
  // Escala parámetros de juego según edad, sin decir "difícil/fácil"
  if(band==='a') return {time:999, items:4, distract:1, lives:5, quizChoices:2, speed:0.7};
  if(band==='b') return {time:45, items:6, distract:2, lives:3, quizChoices:3, speed:1};
  return {time:30, items:8, distract:3, lives:2, quizChoices:4, speed:1.35};
}

/* ============ NAVEGACIÓN DE PANTALLAS ============ */
const stage = document.getElementById('stage');
const topbar = document.getElementById('topbar');
let activeTimer = null;
function stopActiveTimer(){ if(activeTimer){ activeTimer.stop(); activeTimer=null; } }
function show(html, opts={}){
  stopActiveTimer();
  const ibera = opts.sky && State.owned && State.owned.includes('fondo_iberá') ? 'theme-ibera' : '';
  stage.innerHTML = `<div class="screen active ${opts.sky?'bg-sky':''} ${ibera} ${(opts.hud&&!opts.full)?'hud':''} ${opts.full?'full':''}" id="scr">${html}</div>`;
  topbar.style.display = opts.hud ? 'flex':'none';
  if(opts.hud){ document.getElementById('hud-drops').textContent = State.drops; document.getElementById('hud-stars').textContent = Object.values(State.stars).reduce((a,b)=>a+b,0); }
}
document.getElementById('btn-home').onclick = ()=>{ AudioX.click(); renderMap(); };
document.getElementById('btn-sound').onclick = (e)=>{ const on=AudioX.toggle(); e.target.textContent = on?'🔊':'🔇'; };
document.getElementById('btn-store').onclick = ()=>{ AudioX.click(); renderStore(); };

/* ============ TIENDA ============ */
const STORE_ITEMS = [
  {k:'marco_oro', n:'Marco Dorado', desc:'Un anillo dorado para tu avatar', cost:30, e:'⭕'},
  {k:'marco_hoja', n:'Corona de Hojas', desc:'Adorno vegetal para tu avatar', cost:20, e:'🍃'},
  {k:'mascota_pez', n:'Mascota: Dorado', desc:'Un pez dorado del Paraná te acompaña', cost:40, e:'🐟'},
  {k:'mascota_yacare', n:'Mascota: Yacarecito', desc:'Un pequeño yacaré compañero', cost:50, e:'🐊'},
  {k:'fondo_iberá', n:'Fondo: Esteros', desc:'Pinta el mapa con los colores del Iberá', cost:35, e:'🌿'},
  {k:'pista', n:'Pista Extra', desc:'Sumá una pista para tu próximo nivel', cost:15, e:'💡'},
];
function applyPurchase(k){
  if(k==='marco_oro') State.equipped.frame='oro';
  if(k==='marco_hoja') State.equipped.frame='hoja';
  if(k==='mascota_pez') State.equipped.mascot='🐟';
  if(k==='mascota_yacare') State.equipped.mascot='🐊';
  if(k==='pista') State.hints=(State.hints||0)+1;
  // fondo_iberá se aplica solo (ver show()), no necesita estado extra
}
function frameStyle(frame){
  if(frame==='oro') return 'border:4px solid #FFD34D;box-shadow:0 0 0 2px #C98A00;';
  if(frame==='hoja') return 'border:4px solid #3FBF7F;box-shadow:0 0 0 2px #279A5F;';
  return 'border:3px solid #fff;';
}
function avatarChipHTML(size){
  size = size||40;
  const frame = State.equipped.frame;
  return `<div style="position:relative;width:${size}px;height:${size}px;">
    <div style="width:100%;height:100%;border-radius:50%;background:${AVATAR_COLORS[State.avatar]}33;display:flex;align-items:center;justify-content:center;overflow:hidden;${frameStyle(frame)}">
      <div style="width:75%;height:75%;">${AVATARS[State.avatar]()}</div>
    </div>
    ${State.equipped.mascot?`<div style="position:absolute;bottom:-4px;right:-6px;font-size:${size*0.42}px;">${State.equipped.mascot}</div>`:''}
  </div>`;
}
function renderStore(){
  const cards = STORE_ITEMS.map(it=>{
    const consumable = it.k==='pista';
    const owned = !consumable && State.owned.includes(it.k);
    return `<div class="card" style="padding:14px;margin:6px;width:150px;">
      <div style="font-size:2.2em;">${it.e}</div>
      <div style="font-weight:bold;color:var(--oscuro);font-size:.95em;">${it.n}</div>
      <div style="font-size:.75em;color:#555;margin:4px 0 8px;">${it.desc}${consumable?` <b>(tenés ${State.hints||0})</b>`:''}</div>
      ${owned? `<div style="font-weight:bold;color:var(--verde2);">✔ Tenés esto</div>`
        : `<button class="btn" data-k="${it.k}" data-cost="${it.cost}" style="min-width:0;padding:8px 14px;font-size:.9em;">💧${it.cost}</button>`}

function toast(msg, ms=1400){
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  stage.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, ms);
}
function confettiBurst(n=26){
  const colors=['#FFC93C','#3FBF7F','#1CA7EC','#FF6F9C','#8E6FE0'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left = (10+Math.random()*80)+'%';
    c.style.width = c.style.height = (6+Math.random()*7)+'px';
    c.style.background = colors[i%colors.length];
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    stage.appendChild(c);
    const dur = 1200+Math.random()*900;
    c.animate([
      {transform:`translateY(0) rotate(0deg)`, opacity:1},
      {transform:`translateY(${window.innerHeight}px) rotate(${360+Math.random()*360}deg)`, opacity:.9}
    ],{duration:dur, easing:'ease-in'});
    setTimeout(()=>c.remove(), dur);
  }
}

function unlockedCount(){
  let n=1;
  for(let i=0;i<LEVELS.length;i++){ if(State.stars[LEVELS[i].id]>0) n=i+2; }
  return Math.min(n, LEVELS.length);
}
function renderMap(){
  const unlocked = unlockedCount();
  const CH = 1500; // alto virtual del mapa (permite scroll)
  const positions = [
    {x:20,y:88},{x:62,y:76},{x:28,y:60},{x:70,y:46},{x:30,y:28},{x:60,y:10}
  ]; // x en % del ancho, y en % del alto virtual CH
  let nodes='';
  LEVELS.forEach((lv,i)=>{
    const locked = i>=unlocked;
    const stars = State.stars[lv.id]||0;
    nodes += `<div class="map-node ${locked?'locked':''}" style="left:calc(${positions[i].x}% - 41px);top:${positions[i].y*CH/100 - 41}px;background:${lv.color};"
      data-id="${lv.id}"><span style="font-size:2em;">${lv.icon}</span>${stars>0?`<span class="star">${'⭐'.repeat(stars)}</span>`:''}
      <span class="badge">${lv.name}</span></div>`;
  });
  show(`
    <div id="mapscroll">
      <div style="position:sticky;top:0;z-index:5;text-align:center;padding:6px 0 2px;pointer-events:none;">
        <h2 style="margin:0;text-shadow:0 2px 6px rgba(0,0,0,.45);">Mapa de Corrientes 🌿</h2>
      </div>
      <div id="mapcanvas" style="height:${CH}px;">${nodes}</div>
    </div>
  `,{sky:true, hud:true, full:true});
  // sendero: segmentos entre nodos consecutivos calculados en px reales
  const canvas = document.getElementById('mapcanvas');
  const cw = canvas.clientWidth;
  for(let i=0;i<positions.length-1;i++){
    const a = {x:positions[i].x/100*cw, y:positions[i].y*CH/100};
    const b = {x:positions[i+1].x/100*cw, y:positions[i+1].y*CH/100};
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.sqrt(dx*dx+dy*dy), ang=Math.atan2(dy,dx)*180/Math.PI;
    const seg=document.createElement('div');
    seg.style.cssText=`position:absolute;left:${a.x}px;top:${a.y}px;width:${len}px;height:5px;
      background:repeating-linear-gradient(90deg,#ffffffcc 0 9px, transparent 9px 17px);
      transform-origin:0 50%;transform:rotate(${ang}deg);border-radius:3px;`;
    canvas.appendChild(seg);
  }
  document.querySelectorAll('.map-node').forEach(el=>{
    el.onclick=()=>{
      if(el.classList.contains('locked')){ AudioX.wrong(); toast('Completá el nivel anterior 🔒'); return; }
      AudioX.click(); startLevel(el.dataset.id);
    };
  });
  // arranca centrado en el último nivel desbloqueado
  requestAnimationFrame(()=>{
    const ms = document.getElementById('mapscroll');
    const targetY = positions[Math.min(unlocked-1,5)].y*CH/100;
    ms.scrollTop = Math.max(0, targetY - ms.clientHeight*0.6);
  });
}

function runMinigame(id){

/* ---- Utilidad: temporizador visual ---- */
function attachTimer(container, seconds, onEnd){
  if(seconds>900) return {stop(){}, el:null}; // sin límite (modo 6-8)
  const wrap=document.createElement('div');
  wrap.style.cssText='position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:10;';
  wrap.innerHTML = `<div class="timerbar"><div id="tfill"></div></div>`;
  container.appendChild(wrap);
  let t=seconds, total=seconds;
  const fill = wrap.querySelector('#tfill');
  const iv = setInterval(()=>{
    t-=0.1;
    fill.style.width = Math.max(0,(t/total*100))+'%';
    if(t<=3 && t>0) AudioX.tick();
    if(t<=0){ clearInterval(iv); onEnd(); }
  },100);
  const handle = { stop(){ clearInterval(iv); } };
  activeTimer = handle;
  return handle;
}

/* ---- MINIJUEGO 1: Río — arrastrar objetos a "Contamina" o "Río limpio" ---- */
function gameSortRiver(diff, id){
  const pool = [
    {n:'Botella plástica',e:'🧴',bad:true},{n:'Aceite usado',e:'🛢️',bad:true},{n:'Pila',e:'🔋',bad:true},
    {n:'Hoja de árbol',e:'🍃',bad:false},{n:'Pez',e:'🐟',bad:false},{n:'Piedra',e:'🪨',bad:false},
    {n:'Bolsa',e:'🛍️',bad:true},{n:'Jabón en exceso',e:'🧼',bad:true},{n:'Flor',e:'🌸',bad:false},
    {n:'Colilla de cigarro',e:'🚬',bad:true}
  ];
  const items = shuffle(pool).slice(0, diff.items);
  let idx=0, correct=0, lives=diff.lives;
  const html = `
    <div id="minigame-area">
      <div style="text-align:center;padding-top:8px;"><h2>Salvá al Paraná 💧</h2></div>
      <div style="display:flex;justify-content:space-around;margin-top:10px;padding:0 6%;">
        <div class="dropzone" id="zone-bad" style="width:44%;height:170px;">🚯<br>Contamina</div>
        <div class="dropzone" id="zone-good" style="width:44%;height:170px;">🐊<br>Río sano</div>
      </div>
      <div id="itemhost" style="display:flex;justify-content:center;margin-top:24px;"></div>
      <div style="text-align:center;margin-top:10px;color:#04304a;font-weight:bold;">Vidas: <span id="lives">${'💙'.repeat(lives)}</span></div>
    </div>`;
  show(html,{sky:true, hud:true});
  const area = document.getElementById('scr');
  attachTimer(area, diff.time, ()=> finishLevel(id, correct>=Math.ceil(items.length*0.6), starsFrom(correct,items.length)));
  nextItem();
  function nextItem(){
    if(idx>=items.length){ finishLevel(id, correct>=Math.ceil(items.length*0.6), starsFrom(correct,items.length)); return; }
    const it = items[idx];
    document.getElementById('itemhost').innerHTML = `<div class="draggable" id="curitem" style="font-size:3.4em;background:#fff;border-radius:20px;padding:14px 22px;box-shadow:0 6px 14px rgba(0,0,0,.2);">${it.e}<div style="font-size:.28em;font-weight:bold;color:#333;">${it.n}</div></div>`;
    makeDraggable(document.getElementById('curitem'), (zoneId)=>{
      const chose = zoneId==='zone-bad';

      else { lives--; AudioX.wrong(); document.getElementById('lives').textContent='💙'.repeat(Math.max(lives,0)); if(lives<=0){ finishLevel(id,false,0); return; } }
      idx++; nextItem();
    }, ['zone-bad','zone-good']);
  }
}

/* ---- MINIJUEGO 3: Emparejar objeto roto con su nuevo uso (memoria/match) ---- */
function gameMatchRepair(diff, id){
  const pairsAll = [
    {a:'👖 Jean roto', b:'👜 Bolso', k:1},
    {a:'🥫 Lata', b:'🖊️ Portalápices', k:2},

    {a:'👕 Remera vieja', b:'🧵 Trapo de piso', k:6},
  ];
  const nPairs = diff.items<=4?3:(diff.items<=6?4:5);
  const chosen = shuffle(pairsAll).slice(0,nPairs);
  let cards = [];
  chosen.forEach(p=>{ cards.push({txt:p.a,k:p.k}); cards.push({txt:p.b,k:p.k}); });
  cards = shuffle(cards);
  let flipped = [], matched = 0, moves=0;
  const grid = cards.map((c,i)=>`
    <div class="matchcard" data-i="${i}" data-k="${c.k}" style="width:${diff.items<=4?'42%':'30%'};aspect-ratio:1/0.7;background:linear-gradient(180deg,#8E6FE0,#6C4FC9);
      border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:1em;
      box-shadow:0 5px 10px rgba(0,0,0,.2);cursor:pointer;text-align:center;padding:6px;">?</div>
  `).join('');
  show(`
    <div id="minigame-area" style="overflow-y:auto;">
      <div style="text-align:center;padding-top:8px;"><h2>Segunda vida ♻️</h2><p class="sub" style="margin:0 0 8px;">Encontrá cada par: objeto y su nuevo uso.</p></div>
      <div id="grid" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:0 6% 20px;">${grid}</div>
    </div>`,{sky:true, hud:true});
  const area = document.getElementById('scr');
  attachTimer(area, diff.time+nPairs*4, ()=> finishLevel(id, matched>=Math.ceil(nPairs*0.6), starsFrom(matched,nPairs)));
  document.querySelectorAll('.matchcard').forEach(el=>{
    el.onclick=()=>{
      if(el.dataset.flip || flipped.length>=2) return;
      AudioX.pop();
      el.dataset.flip='1';
      el.textContent = cards[+el.dataset.i].txt;
      el.style.background='linear-gradient(180deg,#FFC93C,#FFB300)'; el.style.color='#5A3A00';
      flipped.push(el);
      if(flipped.length===2){
        moves++;
        setTimeout(()=>{
          if(flipped[0].dataset.k===flipped[1].dataset.k){
            AudioX.correct(); matched++;
            flipped.forEach(f=>{ f.style.background='linear-gradient(180deg,#6EE7A5,#3FBF7F)'; f.style.color='#0B3A22'; });
            flipped=[];
            if(matched>=nPairs) finishLevel(id, true, starsFrom(nPairs - Math.max(0,moves-nPairs), nPairs, true));
          } else {
            AudioX.wrong();
            flipped.forEach(f=>{ f.dataset.flip=''; f.textContent='?'; f.style.background='linear-gradient(180deg,#8E6FE0,#6C4FC9)'; f.style.color='#fff'; });
            flipped=[];
          }
        },550);
      }
    };
  });
}

/* ---- MINIJUEGO 4: Armar la cadena circular (ordenar pasos) ---- */
function gameCycleChain(diff, id){
  const chains = [
    ['🍌 Fruta','🍽️ Consumo','🍂 Cáscara','🪱 Compost','🌱 Abono para nueva planta'],
    ['🌳 Árbol','📄 Papel','🗞️ Uso','♻️ Reciclado','📦 Nueva caja'],
    ['🛢️ Petróleo','🧴 Plástico','🚰 Botella usada','♻️ Reciclaje','👕 Ropa reciclada'],
  ];
  const steps = shuffle(chains)[0].slice(0, Math.min(chains[0].length, 3+ (diff.items>6?2:diff.items>4?1:0)));
  const shuffled = shuffle(steps.map((s,i)=>({s,i})));
  let order = [];
  show(`
    <div id="minigame-area">
      <div style="text-align:center;padding-top:8px;"><h2>Armá el ciclo 🔄</h2><p class="sub" style="margin:0;">Tocá los pasos en el orden correcto.</p></div>
      <div id="chain" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;padding:0 6%;"></div>
      <div id="pool" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px;padding:0 6%;"></div>
    </div>`,{sky:true, hud:true});
  const area = document.getElementById('scr');
  let mistakes=0;
  attachTimer(area, diff.time, ()=> finishLevel(id, order.length>=steps.length && mistakes<3, starsFrom(steps.length-mistakes, steps.length)));
  renderChainUI();
  function renderChainUI(){
    document.getElementById('chain').innerHTML = steps.map((s,i)=>`<div style="width:60px;height:60px;border-radius:14px;background:${order[i]!==undefined?'#3FBF7F':'#ffffff55'};display:flex;align-items:center;justify-content:center;font-size:1.6em;border:3px solid #fff;">${order[i]!==undefined?steps[i].split(' ')[0]:i+1}</div>`).join('');
    document.getElementById('pool').innerHTML = shuffled.map(o=>`<div class="poolcard" data-i="${o.i}" style="background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 4px 10px rgba(0,0,0,.15);font-weight:bold;cursor:pointer;${order.includes(o.i)?'opacity:.25;pointer-events:none;':''}">${o.s}</div>`).join('');
    document.querySelectorAll('.poolcard').forEach(el=>{
      el.onclick=()=>{
        const i=+el.dataset.i;
        if(i===order.length){ order.push(i); AudioX.correct(); }
        else { mistakes++; AudioX.wrong(); toast('¡Ese no va ahí todavía!',900); }
        renderChainUI();
        if(order.length===steps.length){ setTimeout(()=>finishLevel(id, mistakes<3, starsFrom(steps.length-mistakes, steps.length)),500); }
      };
    });
  }
}

/* ---- MINIJUEGO 5: Elegir fuentes de energía limpia (multi-selección con feedback) ---- */
function gameEnergyPick(diff, id){
  const options = [
    {n:'Sol (paneles solares)',e:'☀️',clean:true},{n:'Viento (molinos)',e:'🌬️',clean:true},
    {n:'Carbón',e:'⚫',clean:false},{n:'Agua (represas)',e:'🌊',clean:true},
    {n:'Petróleo',e:'🛢️',clean:false},{n:'Geotermia',e:'🌋',clean:true},
    {n:'Gas',e:'🔥',clean:false},
  ];
  const chosen = shuffle(options).slice(0, diff.items>6?7:diff.items>4?6:4);
  let picked = new Set(), locked=false;
  show(`
    <div id="minigame-area" style="overflow-y:auto;">
      <div style="text-align:center;padding-top:8px;"><h2>Energía para la Isla ⚡</h2><p class="sub" style="margin:0;">Elegí las fuentes que no agotan el planeta.</p></div>
      <div id="grid" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px;padding:0 6% 10px;"></div>
      <div style="text-align:center;"><button class="btn green" id="confirm">Confirmar ⚡</button></div>
    </div>`,{sky:true, hud:true});
  document.getElementById('grid').innerHTML = chosen.map((o,i)=>`
    <div class="energyopt" data-i="${i}" style="width:42%;background:#fff;border-radius:16px;padding:14px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.15);border:3px solid transparent;cursor:pointer;">
      <div style="font-size:2em;">${o.e}</div><div style="font-weight:bold;font-size:.85em;color:#333;">${o.n}</div>
    </div>`).join('');
  document.querySelectorAll('.energyopt').forEach(el=>{
    el.onclick=()=>{
      if(locked) return;
      AudioX.pop();
      const i=+el.dataset.i;
      if(picked.has(i)){ picked.delete(i); el.style.borderColor='transparent'; }
      else { picked.add(i); el.style.borderColor='var(--amarillo)'; }
    };
  });
  document.getElementById('confirm').onclick=()=>{
    if(locked) return; locked=true; AudioX.click();
    let correct=0, wrong=0;
    document.querySelectorAll('.energyopt').forEach(el=>{
      const i=+el.dataset.i; const o=chosen[i];
      const isPicked = picked.has(i);
      if(o.clean && isPicked){ correct++; el.style.borderColor='var(--verde)'; el.style.background='#E4FCEE'; }
      else if(!o.clean && !isPicked){ correct++; }
      else { wrong++; el.style.borderColor='#E05A5A'; el.style.background='#FDE8E8'; }
    });
    AudioX[wrong===0?'win':'wrong']();
    setTimeout(()=>finishLevel(id, correct>=Math.ceil(chosen.length*0.7), starsFrom(correct,chosen.length)),1100);
  };
}

/* ---- MINIJUEGO 6 (final): Quiz de decisiones del Consejo del Planeta ---- */
function gameFinalQuiz(diff, id){
  const bank = [
    {q:'Un vecino tira aceite de cocina por la pileta. ¿Qué le decís?',
     opts:['Que está bien, se diluye','Que lo junte en una botella y lo lleve a un punto de reciclaje','Que use más jabón para disimular','Nada, no es importante'], correct:1},
    {q:'¿Qué significa "economía circular"?',
     opts:['Comprar y tirar rápido','Reutilizar y transformar los recursos en vez de desecharlos','Solo reciclar plástico','Usar más energía cada año'], correct:1},
    {q:'Una fábrica genera restos de tela. ¿Qué es más circular?',
     opts:['Quemarlos','Enterrarlos','Usarlos para hacer rellenos de almohadones','Tirarlos al río'], correct:2},
    {q:'¿Cuál ayuda más a un río limpio?',
     opts:['Tirar pilas usadas','Plantar árboles cerca de la orilla','Verter pintura sobre él','Dejar bolsas flotando'], correct:1},
    {q:'Si algo se rompe, ¿qué hacemos en la economía circular antes que tirarlo?',
     opts:['Tirarlo directo','Ver si se puede reparar o reusar','Comprar 3 nuevos','Quemarlo'], correct:1},
    {q:'¿Qué fuente de energía se "agota" con el tiempo?',
     opts:['Solar','Eólica','Petróleo','Geotérmica'], correct:2},
  ];
  const n = diff.items<=4?4:(diff.items<=6?5:6);
  const questions = shuffle(bank).slice(0,n);
  let idx=0, correct=0;
  nextQ();
  function nextQ(){
    if(idx>=questions.length){ finishLevel(id, correct>=Math.ceil(n*0.6), starsFrom(correct,n)); return; }
    const q = questions[idx];
    const optsIdx = shuffle(q.opts.map((o,i)=>({o,i})));
    show(`
      <div class="card" style="max-width:520px;">
        <div class="progressbar"><div style="width:${(idx/questions.length*100)}%;"></div></div>
        <h2>${q.q}</h2>
        <div id="opts" style="display:flex;flex-direction:column;gap:6px;margin-top:10px;">
          ${optsIdx.map(o=>`<div class="quiz-opt" data-correct="${o.i===q.correct}">${o.o}</div>`).join('')}
        </div>
      </div>`,{sky:true, hud:true});
    document.querySelectorAll('.quiz-opt').forEach(el=>{
      el.onclick=()=>{
        if(el.dataset.locked) return;
        document.querySelectorAll('.quiz-opt').forEach(o=>o.dataset.locked='1');
        const ok = el.dataset.correct==='true';
        el.classList.add(ok?'correct':'wrong');
        if(ok){ correct++; AudioX.correct(); } else {
          AudioX.wrong();
          document.querySelectorAll('.quiz-opt').forEach(o=>{ if(o.dataset.correct==='true') o.classList.add('correct'); });
        }
        setTimeout(()=>{ idx++; nextQ(); }, 1000);
      };
    });
  }
}

/* ============ helpers ============ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function starsFrom(correct,total,forceHigh){
  const ratio = total? correct/total : 0;
  if(forceHigh || ratio>=0.9) return 3;
  if(ratio>=0.65) return 2;
  if(ratio>=0.4) return 1;
  return 1;
}
function makeDraggable(el, onDrop, zoneIds){
  let dragging=false, ox=0, oy=0, startX=0, startY=0;
  el.style.position='relative';
  function point(e){ return e.touches? e.touches[0] : e; }
  function down(e){
    dragging=true; const p=point(e);
    const r=el.getBoundingClientRect(); startX=r.left; startY=r.top; ox=p.clientX; oy=p.clientY;
    el.style.zIndex=100; e.preventDefault();
  }
  function move(e){
    if(!dragging) return; const p=point(e);
    const dx=p.clientX-ox, dy=p.clientY-oy;
    el.style.position='fixed'; el.style.left=(startX+dx)+'px'; el.style.top=(startY+dy)+'px';
    e.preventDefault();
  }
  function up(e){
    if(!dragging) return; dragging=false;
    const p = e.changedTouches? e.changedTouches[0] : e;
    let landed=null;
    for(const zid of zoneIds){
      const z=document.getElementById(zid); if(!z) continue;
      const r=z.getBoundingClientRect();
      if(p.clientX>=r.left && p.clientX<=r.right && p.clientY>=r.top && p.clientY<=r.bottom){ landed=zid; z.classList.add('over'); setTimeout(()=>z.classList.remove('over'),300); }
    }
    if(landed){ AudioX.drop(); onDrop(landed); }
    else { el.style.position='relative'; el.style.left=0; el.style.top=0; }
  }
  el.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  el.addEventListener('touchstart',down,{passive:false}); window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);
}
