<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EcoCiclo Corrientes — La Ruta Circular</title>
<meta name="description" content="Juego educativo de economía circular ambientado en la provincia de Corrientes. 8 misiones, modo aula y certificado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --river:#1F7FC2; --river-d:#12557F; --river-l:#5BB6EE;
  --estero:#2FA36B; --estero-d:#1C7A4C; --estero-l:#6FD79E;
  --sun:#F2B544; --sun-d:#C98A1E;
  --clay:#D9694B; --clay-d:#A9472F;
  --violet:#8C6FE0;
  --ink:#06212B; --ink-2:#0B2E3B; --ink-3:#114050;
  --paper:#F6F2E7; --paper-2:#EDE6D6;
  --txt:#EAF6F5; --txt-dim:#9FBDC4;
  --line:rgba(255,255,255,.12);
  --ok:#3FD08A; --bad:#FF6B6B;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-xl:32px;
  --topbar:58px;
  --fs-base:16px;
  --font-ui:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-dis:'Fraunces','Outfit',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-ui);font-size:var(--fs-base);color:var(--txt);
  background:var(--ink);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body.dys{--font-ui:'Outfit',Verdana,sans-serif;letter-spacing:.4px;line-height:1.7;}
button,input,select{font-family:inherit;}
#app{position:fixed;inset:0;overflow:hidden;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.screen.on{display:flex;animation:fade .35s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .4s ease both;}
.stagger>*:nth-child(1){animation-delay:.03s}.stagger>*:nth-child(2){animation-delay:.08s}
.stagger>*:nth-child(3){animation-delay:.13s}.stagger>*:nth-child(4){animation-delay:.18s}
.stagger>*:nth-child(5){animation-delay:.23s}.stagger>*:nth-child(6){animation-delay:.28s}
.stagger>*:nth-child(7){animation-delay:.33s}.stagger>*:nth-child(8){animation-delay:.38s}

/* ---------- fondo ---------- */
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
   radial-gradient(1200px 520px at 15% -5%, rgba(91,182,238,.22), transparent 65%),
   radial-gradient(900px 500px at 92% 8%, rgba(242,181,68,.16), transparent 62%),
   radial-gradient(1000px 700px at 50% 108%, rgba(47,163,107,.22), transparent 70%),
   linear-gradient(175deg,#082635 0%,#06212B 45%,#05191F 100%);
}
.bg .grain{position:absolute;inset:0;opacity:.25;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:3px 3px;}
.bg .wave{position:absolute;left:-10%;width:120%;height:200px;opacity:.5;}
.content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;}

/* ---------- tipografía ---------- */
h1,h2,h3{margin:0;font-weight:700;line-height:1.15;}
.display{font-family:var(--font-dis);font-weight:800;letter-spacing:-.5px;}
.eyebrow{font-size:.72rem;letter-spacing:2.4px;text-transform:uppercase;color:var(--sun);font-weight:600;}
.muted{color:var(--txt-dim);}
.lead{font-size:1.02rem;line-height:1.6;color:#CFE6E7;}

/* ---------- botones ---------- */
.btn{position:relative;border:0;border-radius:var(--r-m);padding:14px 24px;font-size:1rem;font-weight:600;
  cursor:pointer;color:#06212B;background:linear-gradient(180deg,#FFD979,var(--sun));
  box-shadow:0 6px 0 var(--sun-d),0 10px 24px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,filter .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sun-d),0 4px 12px rgba(0,0,0,.3);}
.btn:disabled{filter:grayscale(.7) brightness(.8);cursor:not-allowed;}
.btn.green{background:linear-gradient(180deg,#7FE7B4,var(--estero));box-shadow:0 6px 0 var(--estero-d),0 10px 24px rgba(0,0,0,.35);color:#04291A;}
.btn.blue{background:linear-gradient(180deg,#8ACFF6,var(--river));box-shadow:0 6px 0 var(--river-d),0 10px 24px rgba(0,0,0,.35);color:#04263A;}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--txt);border:1px solid var(--line);box-shadow:none;}
.btn.ghost:active{transform:translateY(2px);}
.btn.sm{padding:10px 16px;font-size:.88rem;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.25);}
.btn.block{width:100%;}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);
  color:var(--txt);font-size:1rem;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px);}
.icon-btn:active{transform:scale(.93);}

/* ---------- superficies ---------- */
.panel{background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));
  border:1px solid var(--line);border-radius:var(--r-l);padding:20px;backdrop-filter:blur(12px);
  box-shadow:0 18px 40px rgba(0,0,0,.32);}
.panel.tight{padding:14px;border-radius:var(--r-m);}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:16px 18px 40px;}
.wrap.narrow{max-width:620px;}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100%;}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:600;color:#D7EDEA;}
.chip.gold{background:rgba(242,181,68,.16);border-color:rgba(242,181,68,.45);color:#FFDB92;}
.chip.green{background:rgba(47,163,107,.18);border-color:rgba(47,163,107,.5);color:#9BEFC4;}
.chip.blue{background:rgba(31,127,194,.2);border-color:rgba(91,182,238,.45);color:#B3E0FF;}
.divider{height:1px;background:var(--line);margin:16px 0;}

/* ---------- topbar ---------- */
#topbar{position:sticky;top:0;z-index:30;height:var(--topbar);flex:0 0 auto;
  display:flex;align-items:center;gap:8px;padding:0 12px;
  background:linear-gradient(180deg,rgba(6,33,43,.92),rgba(6,33,43,.55));backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);}
#topbar .grow{flex:1;min-width:0;}
.stat{display:flex;align-items:center;gap:5px;font-weight:700;font-size:.86rem;background:rgba(255,255,255,.07);
  border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap;}
.stat small{font-weight:500;color:var(--txt-dim);}

/* ---------- barra de progreso ---------- */
.bar{height:9px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--estero-l),var(--estero));
  transition:width .5s cubic-bezier(.2,.8,.2,1);}
.bar.gold>i{background:linear-gradient(90deg,#FFDD8A,var(--sun));}
.bar.thin{height:6px;}

/* ---------- mapa ---------- */
#mapHost{position:relative;width:100%;max-width:760px;margin:0 auto;aspect-ratio:3/4.05;}
#mapHost svg.terrain{position:absolute;inset:0;width:100%;height:100%;}
.node{position:absolute;transform:translate(-50%,-50%);width:74px;text-align:center;cursor:pointer;}
.node .disc{width:62px;height:62px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;
  border:3px solid rgba(255,255,255,.85);box-shadow:0 10px 22px rgba(0,0,0,.45);position:relative;
  background:linear-gradient(180deg,#2C687F,#17475A);transition:transform .15s;}
.node:active .disc{transform:scale(.94);}
.node.done .disc{background:linear-gradient(180deg,#63DFA5,var(--estero-d));}
.node.next .disc{background:linear-gradient(180deg,#FFD979,var(--sun-d));animation:float 2.6s ease-in-out infinite;
  box-shadow:0 0 0 6px rgba(242,181,68,.2),0 10px 22px rgba(0,0,0,.45);}
.node.locked{cursor:not-allowed;}
.node.locked .disc{filter:grayscale(1) brightness(.6);border-color:rgba(255,255,255,.35);}
.node .nm{font-size:.63rem;font-weight:700;margin-top:6px;line-height:1.2;text-shadow:0 2px 6px rgba(0,0,0,.9);}
.node .st{position:absolute;top:-6px;right:-2px;font-size:.62rem;background:#06212B;border:1px solid var(--line);
  border-radius:999px;padding:2px 6px;font-weight:700;}
.node .num{position:absolute;left:-4px;top:-4px;width:22px;height:22px;border-radius:50%;background:#06212B;
  border:1px solid var(--line);font-size:.7rem;display:grid;place-items:center;font-weight:700;}

/* ---------- juego ---------- */
.gamehead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.prompt{background:rgba(255,255,255,.06);border:1px solid var(--line);border-left:3px solid var(--sun);
  border-radius:12px;padding:12px 14px;font-size:.93rem;line-height:1.5;}
.card-item{animation:pop .3s ease both;}
.opt{width:100%;text-align:left;background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:var(--r-m);
  padding:14px 16px;color:var(--txt);font-size:.95rem;cursor:pointer;transition:.15s;display:flex;gap:12px;align-items:flex-start;
  line-height:1.45;}
.opt:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);}
.opt:active{transform:scale(.99);}
.opt .k{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.12);display:grid;place-items:center;
  font-weight:700;font-size:.8rem;}
.opt.ok{background:rgba(63,208,138,.18);border-color:var(--ok);}
.opt.no{background:rgba(255,107,107,.15);border-color:var(--bad);animation:shake .4s;}
.opt.dim{opacity:.45;}
.opt.sel{border-color:var(--sun);background:rgba(242,181,68,.15);}
.optgrid{display:grid;gap:10px;}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bin{border-radius:var(--r-m);border:2px dashed rgba(255,255,255,.28);background:rgba(255,255,255,.05);
  padding:14px 10px;text-align:center;cursor:pointer;transition:.15s;}
.bin:active{transform:scale(.97);}
.bin b{display:block;font-size:.95rem;margin-top:4px;}
.bin span{font-size:.72rem;color:var(--txt-dim);display:block;margin-top:3px;line-height:1.3;}
.feedback{border-radius:var(--r-m);padding:13px 15px;font-size:.9rem;line-height:1.55;animation:rise .3s ease both;}
.feedback.ok{background:rgba(63,208,138,.14);border:1px solid rgba(63,208,138,.45);}
.feedback.no{background:rgba(255,107,107,.13);border:1px solid rgba(255,107,107,.45);}
.feedback b{display:block;margin-bottom:4px;font-size:.95rem;}
.meters{display:grid;gap:9px;}
.meter{display:grid;grid-template-columns:104px 1fr 42px;align-items:center;gap:9px;font-size:.78rem;}
.meter .bar{height:10px;}
.tile{background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;
  text-align:center;font-size:.85rem;font-weight:600;transition:.15s;line-height:1.3;}
.tile:active{transform:scale(.96);}
.tile.sel{border-color:var(--sun);background:rgba(242,181,68,.16);}
.tile.ok{border-color:var(--ok);background:rgba(63,208,138,.18);}
.tile.no{border-color:var(--bad);background:rgba(255,107,107,.15);}
.tile.used{opacity:.35;pointer-events:none;}
.tile .em{display:block;font-size:1.5rem;margin-bottom:5px;}
.seq{display:flex;flex-wrap:wrap;gap:7px;min-height:44px;padding:9px;border-radius:12px;background:rgba(0,0,0,.25);
  border:1px dashed var(--line);}
.seq .s{background:rgba(242,181,68,.2);border:1px solid rgba(242,181,68,.5);border-radius:9px;padding:6px 10px;font-size:.78rem;font-weight:600;}
.hearts{letter-spacing:2px;font-size:.95rem;}
.timer{font-variant-numeric:tabular-nums;}
.timer.warn{color:#FFB4B4;animation:shake .5s infinite;}

/* ---------- toast / overlay ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:rgba(6,33,43,.96);border:1px solid var(--line);border-radius:14px;padding:12px 20px;font-weight:600;
  font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
#fx{position:fixed;inset:0;pointer-events:none;z-index:150;}
#modal{position:fixed;inset:0;z-index:180;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(3,15,20,.75);backdrop-filter:blur(6px);}
#modal.on{display:flex;}
#modal .panel{max-width:560px;width:100%;max-height:88vh;overflow-y:auto;animation:pop .28s ease both;}

/* ---------- varios ---------- */
.avatars{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;}
.av{border-radius:18px;border:2px solid var(--line);background:rgba(255,255,255,.05);padding:10px 6px;cursor:pointer;text-align:center;transition:.15s;}
.av.sel{border-color:var(--sun);background:rgba(242,181,68,.14);}
.av svg{width:58px;height:58px;}
.av b{display:block;font-size:.72rem;margin-top:4px;}
.av small{display:block;font-size:.6rem;color:var(--txt-dim);}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;}
.badge{text-align:center;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:.68rem;line-height:1.25;}
.badge.off{opacity:.3;filter:grayscale(1);}
.badge .e{font-size:1.6rem;display:block;margin-bottom:5px;}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:.87rem;padding:7px 0;border-bottom:1px dashed var(--line);}
.kv:last-child{border:0;}
table.tbl{width:100%;border-collapse:collapse;font-size:.82rem;}
table.tbl th,table.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
table.tbl th{color:var(--sun);font-size:.7rem;text-transform:uppercase;letter-spacing:1px;}
.stars{color:var(--sun);letter-spacing:3px;font-size:1.3rem;}
input[type=text]{width:100%;background:rgba(255,255,255,.08);border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;color:var(--txt);font-size:1rem;}
input[type=text]:focus{outline:none;border-color:var(--sun);}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem;}
.sw{width:50px;height:28px;border-radius:999px;background:rgba(255,255,255,.15);border:1px solid var(--line);position:relative;cursor:pointer;flex:0 0 auto;}
.sw i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;}
.sw.on{background:var(--estero);}
.sw.on i{left:25px;}
.cert{background:linear-gradient(160deg,#FBF7EC,#EFE7D3);color:#12333F;border-radius:20px;padding:26px 22px;text-align:center;
  border:3px double #C9A45B;box-shadow:0 20px 50px rgba(0,0,0,.45);}
.cert h2{font-family:var(--font-dis);font-size:1.5rem;color:#0E3A2C;}
.cert .nm{font-family:var(--font-dis);font-size:1.7rem;margin:10px 0;border-bottom:2px solid #C9A45B;display:inline-block;padding:0 18px 6px;}
.scroll-x{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
.scroll-x::-webkit-scrollbar{display:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px;}
@media(max-width:420px){
  :root{--fs-base:15px;}
  .wrap{padding:14px 13px 36px;}
  .node{width:64px;} .node .disc{width:52px;height:52px;font-size:1.3rem;}
}
@media print{
  body{background:#fff;overflow:visible;}
  .noprint{display:none!important;}
  .screen{position:static;display:block;overflow:visible;}
  .bg{display:none;}
  .panel,.cert{box-shadow:none;color:#000;}
}
</style>
</head>
<body>
<div id="app">
  <div class="bg">
    <div class="grain"></div>
    <svg class="wave" style="bottom:-40px" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path d="M0,120 C200,60 320,170 520,120 C720,70 860,160 1060,110 C1140,90 1180,100 1200,95 L1200,200 L0,200Z" fill="rgba(31,127,194,.18)"/>
    </svg>
    <svg class="wave" style="bottom:-70px" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path d="M0,140 C180,90 400,180 600,130 C800,80 980,170 1200,120 L1200,200 L0,200Z" fill="rgba(47,163,107,.18)"/>
    </svg>
  </div>
</div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<div id="modal"><div class="panel" id="modalBody"></div></div>
<script>
/* =========================================================
   ECOCICLO CORRIENTES — LA RUTA CIRCULAR
   Juego educativo de economía circular · Provincia de Corrientes
   ========================================================= */
const APP = document.getElementById('app');

/* ---------------- Estado ---------------- */
const DEFAULT = {
  name:'', avatar:'carpincho', band:'', xp:0, coins:0,
  levels:{}, badges:[], seen:{}, done:false, certName:'',
  settings:{sound:true, timer:true, dys:false, aula:false},
  stats:{correct:0, total:0, played:0}
};
let S = JSON.parse(JSON.stringify(DEFAULT));
const SAVE_KEY='ecociclo_ctes_v2';
function save(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){} }
function load(){ try{const r=localStorage.getItem(SAVE_KEY); if(r){S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(r)); S.settings=Object.assign({},DEFAULT.settings,S.settings||{}); S.stats=Object.assign({},DEFAULT.stats,S.stats||{});}}catch(e){} }

/* ---------------- Audio ---------------- */
const Snd=(()=>{ let ctx=null;
  const ok=()=>{ if(!S.settings.sound) return false; try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return false;} if(ctx.state==='suspended')ctx.resume(); return true; };
  function t(f,d=.12,type='sine',v=.14,at=0){ if(!ok())return; const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);const s=ctx.currentTime+at;
    g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);
    o.start(s);o.stop(s+d+.02);}
  return{
    tap:()=>t(520,.06,'triangle',.08),
    good:()=>{t(660,.1,'sine',.13);t(880,.13,'sine',.12,.08);t(1180,.16,'sine',.1,.17);},
    bad:()=>{t(200,.16,'sawtooth',.09);t(150,.2,'sawtooth',.08,.1);},
    win:()=>{[523,659,784,1047].forEach((f,i)=>t(f,.22,'triangle',.13,i*.11));},
    lose:()=>{[392,330,262].forEach((f,i)=>t(f,.25,'sine',.11,i*.13));},
    coin:()=>{t(1280,.07,'square',.07);t(1720,.09,'square',.06,.05);}
  };
})();

/* ---------------- FX confeti ---------------- */
const fx=document.getElementById('fx'); let fxc=null; try{fxc=fx.getContext('2d');}catch(e){} let parts=[],raf=null;
function sizeFx(){ if(!fxc) return; fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; fx.style.width=innerWidth+'px'; fx.style.height=innerHeight+'px'; fxc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener('resize',sizeFx); sizeFx();
function confetti(n=60){ if(!fxc) return;
  const cols=['#F2B544','#2FA36B','#1F7FC2','#D9694B','#8C6FE0','#6FD79E'];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,
    vx:(Math.random()-.5)*9, vy:-Math.random()*11-4, g:.32+Math.random()*.2,
    s:5+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.35, c:cols[i%cols.length], life:90+Math.random()*50});
  if(!raf) loopFx();
}
function loopFx(){ if(!fxc) return; fxc.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
    fxc.save();fxc.translate(p.x,p.y);fxc.rotate(p.r);fxc.fillStyle=p.c;fxc.globalAlpha=Math.min(1,p.life/40);
    fxc.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);fxc.restore(); });
  if(parts.length) raf=requestAnimationFrame(loopFx); else {raf=null;fxc.clearRect(0,0,innerWidth,innerHeight);}
}

/* ---------------- Utilidades UI ---------------- */
function toast(msg,ms=1800){ const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),ms); }
function modal(html){ document.getElementById('modalBody').innerHTML=html; document.getElementById('modal').classList.add('on'); }
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
let stopTimer=null;
function screen(html,opts={}){
  if(stopTimer){stopTimer();stopTimer=null;}
  const old=APP.querySelector('.screen'); if(old) old.remove();
  const d=document.createElement('div'); d.className='screen on'; d.id='scr';
  d.innerHTML=(opts.bar===false?'':topbar(opts))+`<div class="content">${html}</div>`;
  APP.appendChild(d); d.scrollTop=0; bindTop();
  return d;
}

/* ---------------- Marco de juego ---------------- */
function gameShell(l,body,opts={}){
  const d=screen(`<div class="wrap narrow">
    <div class="gamehead">
      <span class="chip">${l.icon} ${l.place}</span>
      <span class="chip" id="prog">—</span>
      <span class="grow" style="flex:1"></span>
      ${opts.timer&&S.settings.timer?'<span class="chip gold timer" id="clock">⏱ --</span>':''}
    </div>
    <div class="bar thin" style="margin-bottom:14px;"><i id="pbar" style="width:0%"></i></div>
    <div id="gbody">${body}</div>
  </div>`,{title:l.name,back:'map'});
  return d;
}
function setProg(i,n){ const p=document.getElementById('prog'), b=document.getElementById('pbar');
  if(p) p.textContent=`Ronda ${Math.min(i+1,n)} / ${n}`; if(b) b.style.width=(i/n*100)+'%'; }
function useTimer(secs,onEnd){
  if(!S.settings.timer||!secs) return;
  const el=document.getElementById('clock'); if(!el) return;
  let t=secs; el.textContent='⏱ '+t;
  const iv=setInterval(()=>{ t--; el.textContent='⏱ '+Math.max(t,0);
    el.classList.toggle('warn',t<=5);
    if(t<=0){ clearInterval(iv); onEnd(); } },1000);
  stopTimer=()=>clearInterval(iv);
  return ()=>{clearInterval(iv); if(stopTimer)stopTimer=null;};
}

/* ---------------- Fin de misión ---------------- */
function finishLevel(l,correct,total,extra){
  if(stopTimer){stopTimer();stopTimer=null;}
  const pct=Math.round(correct/Math.max(total,1)*100);
  const stars=pct>=90?3:pct>=70?2:pct>=50?1:0;
  const pass=pct>=50;
  const prev=lvState(l.id);
  S.levels[l.id]={stars:Math.max(prev.stars||0,stars),best:Math.max(prev.best||0,pct),done:prev.done||pass};
  S.stats.correct+=correct; S.stats.total+=total; S.stats.played++;
  addXP(correct*10+stars*25);
  if(pass) grantBadge('b_start');
  if(stars===3) grantBadge('b_perfect');
  if(Object.values(S.levels).filter(x=>x.done).length>=4) grantBadge('b_half');
  if(Object.values(S.levels).filter(x=>x.done).length>=LEVELS.length) grantBadge('b_all');
  if(totalStars()>=20) grantBadge('b_stars');
  save();
  pass?(Snd.win(),confetti(70)):Snd.lose();
  const i=LEVELS.indexOf(l), nxt=LEVELS[i+1];
  screen(`<div class="wrap narrow stagger" style="padding-top:26px;">
    <div class="panel" style="text-align:center;">
      <div style="font-size:2.6rem;animation:pop .5s ease both">${pass?'🎉':'💪'}</div>
      <h2 class="display" style="font-size:1.4rem;margin-top:6px;">${pass?'Misión cumplida':'Casi lo lográs'}</h2>
      <div class="stars" style="margin:10px 0;">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap;">
        <span class="chip green">${correct}/${total} correctas</span>
        <span class="chip blue">${pct}% de acierto</span>
        <span class="chip gold">+${correct*10+stars*25} 🌱</span>
      </div>
      ${extra?`<div class="prompt" style="margin-top:14px;text-align:left;">${extra}</div>`:''}
    </div>
    <div class="panel" style="margin-top:12px;">
      <div class="eyebrow">Saber + · Corrientes</div>
      <p style="font-size:.9rem;line-height:1.6;margin:8px 0 0;">${l.data}</p>
    </div>
    <div style="display:grid;gap:9px;margin-top:14px;">
      ${pass&&nxt?`<button class="btn green block" id="next">Siguiente misión: ${nxt.place} →</button>`:''}
      <button class="btn ${pass?'ghost':''} block" id="again">↻ Reintentar esta misión</button>
      <button class="btn ghost block sm" data-go="map">Volver al mapa</button>
    </div>
  </div>`,{title:'Resultado',back:'map'});
  const n=document.getElementById('next'); if(n) n.onclick=()=>{Snd.tap();renderBriefing(nxt);};
  document.getElementById('again').onclick=()=>{Snd.tap();runGame(l);};
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{Snd.tap();go(b.dataset.go);});
}

function gCiclos(l){

  let i=0,correct=0;
  gameShell(l,`<div id="stage"></div>`,{timer:true});

function gEscalera(l){
  const d=DIF(); const cases=shuffle(R_CASES).slice(0,Math.min(d.rounds,R_CASES.length));
  let i=0,correct=0;
  gameShell(l,`<div id="stage"></div>`,{timer:true});
  paint();
  function paint(){
    if(i>=cases.length) return finishLevel(l,correct,cases.length);
    setProg(i,cases.length);
    const c=cases[i];
    const bestIdx=R_SCALE.findIndex(r=>r.k===c.best);
    const distract=shuffle(R_SCALE.filter(r=>r.k!==c.best && Math.abs(R_SCALE.indexOf(r)-bestIdx)<=6)).slice(0,3);
    const opts=shuffle([R_SCALE[bestIdx],...distract]);
    document.querySelector('#stage').innerHTML=`

    const done=useTimer(d.time,()=>answer(null));
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>answer(b.dataset.k));
    function answer(k){
      if(done)done();
      const ok=k===c.best; hit(ok); if(ok){correct++;Snd.good();}else Snd.bad();
      document.querySelectorAll('[data-k]').forEach(b=>{ b.style.pointerEvents='none';
        if(b.dataset.k===c.best)b.classList.add('ok'); else if(b.dataset.k===k)b.classList.add('no'); else b.classList.add('dim'); });

    if(i>=rounds.length) return finishLevel(l,correct,rounds.length);

function gEcodiseno(l){
  let i=0, acc={dur:0,rep:0,rec:0,hue:0}, log=[];
  gameShell(l,`<div id="stage"></div>`);
  paint();
  function meters(){
    const f=(v)=>Math.round(v/(i||1)*10);
    const M=[['Durabilidad','dur','--estero'],['Reparabilidad','rep','--sun'],['Reciclabilidad','rec','--river-l'],['Huella baja','hue','--violet']];
    return `<div class="meters panel tight" style="margin-bottom:14px;">
      ${M.map(([n,k])=>`<div class="meter"><span>${n}</span><span class="bar"><i style="width:${f(acc[k])}%"></i></span><b>${f(acc[k])}</b></div>`).join('')}</div>`;
  }
  function paint(){
    if(i>=DESIGN_STEPS.length) return done();
    setProg(i,DESIGN_STEPS.length);
    const s=DESIGN_STEPS[i], opts=shuffle(s.opts);
    document.querySelector('#stage').innerHTML=`${i?meters():''}
      <div class="prompt card-item"><b>Decisión ${i+1} de 5</b><br>${s.q}</div>
      <div class="optgrid" style="margin-top:12px">${opts.map((o,j)=>`<button class="opt" data-j="${s.opts.indexOf(o)}"><span class="k">${'ABCD'[j]}</span><span>${o.t}</span></button>`).join('')}</div>
      <div id="fb" style="margin-top:12px"></div>`;
    document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{
      const o=s.opts[+b.dataset.j];
      const score=(o.m.dur+o.m.rep+o.m.rec+o.m.hue)/4;
      const best=Math.max(...s.opts.map(x=>(x.m.dur+x.m.rep+x.m.rec+x.m.hue)/4));
      const good=score>=best-0.8; hit(good); good?Snd.good():Snd.bad();
      Object.keys(acc).forEach(k=>acc[k]+=o.m[k]);
      log.push({q:s.q,t:o.t,score});
      document.querySelectorAll('[data-j]').forEach(x=>{x.style.pointerEvents='none'; if(x===b)x.classList.add(good?'ok':'no'); else x.classList.add('dim');});
      document.getElementById('fb').innerHTML=`<div class="feedback ${good?'ok':'no'}">
        <b>${good?'✔ Gran decisión de diseño':'⚠ Esta decisión te va a costar'}</b>${o.w}
        <div style="margin-top:10px"><button class="btn sm" id="nx">Siguiente decisión →</button></div></div>`;
      document.getElementById('nx').onclick=()=>{Snd.tap();i++;paint();};
    });
  }
  function done(){
    const f=k=>Math.round(acc[k]/5*10);
    const total=Math.round((f('dur')+f('rep')+f('rec')+f('hue'))/4);
    const correct=Math.round(total/100*5);
    if(total>=80) grantBadge('b_design');
    const veredicto= total>=85?'Producto de referencia: podría venderse como servicio y durar décadas.'
      : total>=65?'Buen producto circular, con algún punto flojo a mejorar.'
      : total>=45?'Producto intermedio: cumple, pero mantiene lógicas lineales.'
      : 'Producto lineal: nació con fecha de vencimiento.';
    finishLevel(l,correct,5,`<b>Puntaje de ecodiseño: ${total}/100.</b> ${veredicto}<br><br>
      Durabilidad ${f('dur')} · Reparabilidad ${f('rep')} · Reciclabilidad ${f('rec')} · Huella baja ${f('hue')}`);
  }
}

const COMPOST_POOL=[

function gCompost(l){
  const rounds=DIF().rounds; let cn=50,hum=50,i=0,correct=0,perfect=true;
  gameShell(l,`<div id="stage"></div>`);
  const dist=(a,b)=>Math.abs(a-50)+Math.abs(b-50);
  function zone(v){ return v>=38&&v<=62; }
  paint();

    const g=(label,v,lo,hi)=>`<div class="meter"><span>${label}</span>
      <span class="bar" style="position:relative;background:linear-gradient(90deg,#FF6B6B 0%,#FF6B6B 30%,#3FD08A 38%,#3FD08A 62%,#FF6B6B 70%,#FF6B6B 100%);opacity:.9">

      <b style="color:${zone(v)?'#7FE7B4':'#FFB4B4'}">${Math.round(v)}</b></div>
      <div class="muted" style="font-size:.67rem;margin:-4px 0 4px 113px">${lo} ← → ${hi}</div>`;
    return `<div class="meters panel tight" style="margin-bottom:12px;">
      ${g('Carbono/Nitró.',cn,'exceso de verdes','exceso de marrones')}
      ${g('Humedad',hum,'seco','encharcado')}</div>`;

  function paint(){
    if(i>=rounds){

      return finishLevel(l,correct,rounds,est);

    const results=opts.map(o=>o.t==='no'?9999:dist(cn+o.cn,hum+o.hum));

      setProg(matched,n);
      if(matched===n){ setTimeout(()=>finishLevel(l,n,Math.max(n,tries),
        `Cerraste ${n} conexiones con ${tries} intentos. Cada conexión evita extraer materia prima nueva y ahorra el costo de disponer un residuo.`),900); }
    } else { Snd.bad(); el.classList.add('no'); const s=sel; s.classList.add('no');
      setTimeout(()=>{el.classList.remove('no');s.classList.remove('no','sel');},600);
      document.getElementById('fb').innerHTML=`<div class="feedback no"><b>✘ Esa industria no puede usar ese material</b>Pensá qué necesita cada proceso como insumo: fibra, nutrientes, calor o energía.</div>`;
      sel=null;
    }
  });
}

function gCicloVida(l){
  const n=({exp:2,inv:3,est:4})[S.band||'inv'];
  const rounds=shuffle(SEQS).slice(0,Math.min(n,SEQS.length));
  let r=0,correct=0,total=0;
  gameShell(l,`<div id="stage"></div>`);
  paint();
  function paint(){
    if(r>=rounds.length) return finishLevel(l,correct,total);
    const R=rounds[r]; let idx=0;
    setProg(r,rounds.length);
    const opts=shuffle(R.steps);
    document.querySelector('#stage').innerHTML=`
      <div class="panel tight card-item" style="display:flex;gap:11px;align-items:center;">
        <div style="font-size:2rem">${R.e}</div><div><div class="eyebrow">Secuencia ${r+1} de ${rounds.length}</div><b>${R.t}</b></div></div>
      <p class="muted" style="font-size:.8rem;margin:12px 0 7px;">Tocá los pasos en el orden correcto, del principio al final.</p>
      <div class="seq" id="seq"></div>
      <div class="optgrid" style="grid-template-columns:1fr 1fr;margin-top:12px" id="opts">
        ${opts.map((s,j)=>`<div class="tile" data-s="${esc(s)}">${s}</div>`).join('')}</div>
      <div id="fb" style="margin-top:12px"></div>`;
    document.querySelectorAll('[data-s]').forEach(el=>el.onclick=()=>{
      const s=el.dataset.s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
      total++;
      const ok=s===R.steps[idx]; hit(ok);
      if(ok){ correct++; Snd.good(); el.classList.add('used');
        document.getElementById('seq').insertAdjacentHTML('beforeend',`<span class="s">${idx+1}. ${s}</span>`);
        idx++;
        if(idx>=R.steps.length){
          document.getElementById('fb').innerHTML=`<div class="feedback ok"><b>✔ Ciclo completo</b>${R.w}
            <div style="margin-top:10px"><button class="btn sm" id="nx">Continuar →</button></div></div>`;
          document.getElementById('nx').onclick=()=>{Snd.tap();r++;paint();};
        }

        Snd.bad(); el.classList.add('no'); setTimeout(()=>el.classList.remove('no'),500);
        document.getElementById('fb').innerHTML=`<div class="feedback no"><b>✘ Ese paso todavía no</b>
          Pista: el paso ${idx+1} empieza con “${R.steps[idx].slice(0,14)}…”.</div>`;
      }
    });
  }
}

function gConsejo(l){
  let year=0, budget=100, chosen=[], IND={res:100,emi:100,emp:20,con:30};
  gameShell(l,`<div id="stage"></div>`);
  paint();
  function indHTML(){
    const rows=[['Residuos enterrados','res',true],['Emisiones','emi',true],['Empleo verde','emp',false],['Conciencia ciudadana','con',false]];
    return `<div class="meters panel tight" style="margin-bottom:12px;">
      ${rows.map(([n,k,inv])=>{ const v=Math.max(0,Math.min(100,IND[k]));
        const good=inv?v<=60:v>=55;
        return `<div class="meter"><span>${n}</span><span class="bar"><i style="width:${v}%;background:${good?'linear-gradient(90deg,#6FD79E,#2FA36B)':'linear-gradient(90deg,#FF9B9B,#E05656)'}"></i></span><b>${Math.round(v)}</b></div>`;
      }).join('')}</div>`;
  }
  function paint(){
    if(year>=3) return end();
    setProg(year,3);
    const pool=shuffle(POLICIES).slice(0,6);
    document.querySelector('#stage').innerHTML=`${indHTML()}
      <div class="prompt card-item"><b>Año ${year+1} de gestión</b><br>Presupuesto disponible: <b id="bud">${budget}</b> puntos. Elegí las medidas y cerrá el año.</div>
      <div class="optgrid" style="margin-top:12px" id="pol">
        ${pool.map((p,j)=>`<button class="opt" data-p="${POLICIES.indexOf(p)}"><span class="k">${p.c}</span>
          <span><b>${p.n}</b><br><span class="muted" style="font-size:.78rem">Costo ${p.c} puntos</span></span></button>`).join('')}</div>
      <button class="btn green block" style="margin-top:14px" id="close">Cerrar el año ▸</button>
      <div id="fb" style="margin-top:12px"></div>`;
    let sel=[];
    document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
      const id=+b.dataset.p, p=POLICIES[id];
      if(sel.includes(id)){ sel=sel.filter(x=>x!==id); budget+=p.c; b.classList.remove('sel'); }
      else { if(budget<p.c){ Snd.bad(); toast('Presupuesto insuficiente para esa medida'); return; }
        sel.push(id); budget-=p.c; b.classList.add('sel'); Snd.coin(); }
      document.getElementById('bud').textContent=budget;
    });
    document.getElementById('close').onclick=()=>{
      if(!sel.length){ toast('Elegí al menos una medida'); return; }
      Snd.tap();
      sel.forEach(id=>{ const p=POLICIES[id]; Object.keys(p.e).forEach(k=>IND[k]=Math.max(0,Math.min(100,IND[k]+p.e[k]))); chosen.push(p); });
      IND.res=Math.min(100,IND.res+3); IND.con=Math.max(0,IND.con-2); // inercia
      budget=100;
      document.querySelector('#stage').innerHTML=`${indHTML()}
        <div class="panel"><div class="eyebrow">Informe del año ${year+1}</div>
        ${sel.map(id=>{const p=POLICIES[id];const bad=p.e.emi>0||p.e.res>0;
          return `<div class="feedback ${bad?'no':'ok'}" style="margin-top:9px"><b>${bad?'⚠':'✔'} ${p.n}</b>${p.w}</div>`;}).join('')}
        <button class="btn block" style="margin-top:14px" id="nx">${year<2?'Pasar al año siguiente →':'Ver balance final →'}</button></div>`;
      document.getElementById('nx').onclick=()=>{Snd.tap();year++;paint();};
    };
  }
  function end(){
    const greens=[IND.res<=60,IND.emi<=60,IND.emp>=55,IND.con>=60].filter(Boolean).length;
    if(greens===4) grantBadge('b_gov');
    const txt=greens===4?'Corrientes cierra la gestión como provincia modelo en economía circular.'
      :greens>=2?'Hubo avances concretos, pero quedaron frentes abiertos para la próxima gestión.'
      :'La gestión mantuvo la lógica lineal: mucho enterramiento y poco aprovechamiento.';
    finishLevel(l,greens,4,`<b>${greens} de 4 indicadores en verde.</b> ${txt}<br><br>
      Residuos ${Math.round(IND.res)} · Emisiones ${Math.round(IND.emi)} · Empleo verde ${Math.round(IND.emp)} · Conciencia ${Math.round(IND.con)}`);
  }
}

      <div id="fb" style="margin-top:12px"></div>`,{title:'Desafío final',back:'map'});
    document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{
      const good=+b.dataset.j===q.c; if(good){ok++;Snd.good();}else Snd.bad();
      document.querySelectorAll('[data-j]').forEach(x=>{x.style.pointerEvents='none';
        if(+x.dataset.j===q.c)x.classList.add('ok'); else if(x===b)x.classList.add('no'); else x.classList.add('dim');});
      document.getElementById('fb').innerHTML=`<div class="feedback ${good?'ok':'no'}"><b>${good?'✔ Correcto':'✘ Incorrecto'}</b>
        Respuesta correcta: ${q.o[q.c]}.<div style="margin-top:10px"><button class="btn sm" id="nx">Continuar →</button></div></div>`;
      document.getElementById('nx').onclick=()=>{Snd.tap();i++;paint();};
    });
  }
  function end(){
    const pct=Math.round(ok/qs.length*100), pass=pct>=70;
    if(pass){ S.done=true; grantBadge('b_cert'); addXP(200); save(); confetti(110); Snd.win(); } else Snd.lose();
    screen(`<div class="wrap narrow center" style="padding-top:30px">
      <div class="panel" style="text-align:center;width:100%">
        <div style="font-size:2.8rem">${pass?'🎓':'📚'}</div>
        <h2 class="display" style="font-size:1.4rem;margin-top:8px">${pass?'¡Aprobado!':'Todavía no'}</h2>
        <p class="lead" style="font-size:.92rem">${ok} de ${qs.length} correctas (${pct}%). ${pass?'Ya podés emitir tu certificado de Agente Circular de Corrientes.':'Necesitás 70% para aprobar. Repasá el glosario y volvé a intentarlo.'}</p>
        <div style="display:grid;gap:9px;margin-top:14px">
          ${pass?'<button class="btn block" data-go="cert">📜 Ver mi certificado</button>':''}
          <button class="btn ${pass?'ghost':''} block" id="rt">↻ Volver a intentar</button>
          <button class="btn ghost block sm" data-go="map">Volver al mapa</button>
        </div>
      </div></div>`,{title:'Resultado final',back:'map'});
    document.getElementById('rt').onclick=()=>{Snd.tap();renderFinalChallenge();};
    document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{Snd.tap();go(b.dataset.go);});
  }
}
function renderCert(){
  const nm=S.certName||S.name||'Agente Circular';
  const f=new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
  screen(`<div class="wrap narrow">
    <div class="cert" id="certBox">
      <div style="font-size:.68rem;letter-spacing:3px;text-transform:uppercase;color:#7A6236">EcoCiclo · Provincia de Corrientes</div>
      <h2 style="margin-top:8px">Certificado de Agente Circular</h2>
      <p style="font-size:.85rem;margin:14px 0 0;color:#3B5A55">Se otorga a</p>
      <div class="nm">${esc(nm)}</div>
      <p style="font-size:.86rem;line-height:1.6;margin:12px auto 0;max-width:420px;color:#2A4A46">
        por completar las ocho misiones de la Ruta Circular y aprobar el desafío final sobre economía circular
        aplicada al territorio correntino, alcanzando ${totalStars()} de ${LEVELS.length*3} estrellas y ${S.xp} puntos EcoCiclo.</p>
      <div style="display:flex;justify-content:space-around;margin-top:22px;font-size:.72rem;color:#3B5A55">
        <div>${f}<div style="border-top:1px solid #C9A45B;margin-top:5px;padding-top:4px">Fecha</div></div>
        <div>🌿<div style="border-top:1px solid #C9A45B;margin-top:5px;padding-top:4px">EcoCiclo Corrientes</div></div>
      </div>
    </div>
    <div class="noprint" style="margin-top:14px;display:grid;gap:9px">
      <input type="text" id="cn" placeholder="Escribí tu nombre completo" value="${esc(nm==='Agente Circular'?'':nm)}">
      <button class="btn green block" id="upd">Actualizar nombre</button>
      <button class="btn block" onclick="window.print()">🖨 Imprimir o guardar en PDF</button>
      <button class="btn ghost block sm" data-go="map">Volver al mapa</button>
    </div></div>`,{title:'Certificado',back:'map'});
  document.getElementById('upd').onclick=()=>{ S.certName=document.getElementById('cn').value.trim(); save(); Snd.good(); renderCert(); };
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{Snd.tap();go(b.dataset.go);});
}

/* =========================================================
   ARRANQUE
   ========================================================= */
load();
document.body.classList.toggle('dys',!!S.settings.dys);
renderHome();
</script>
